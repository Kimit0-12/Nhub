<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">NHub — focus, breaks and rewards</title>
  <desc id="desc">Playful productivity banner in navy, teal and orange.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#082134"/><stop offset="1" stop-color="#123d50"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity=".3"/></filter></defs>
  <rect width="1200" height="360" rx="34" fill="url(#bg)"/>
  <circle cx="1050" cy="60" r="225" fill="#31d5c5" opacity=".13"/><circle cx="1125" cy="312" r="170" fill="#f68a30" opacity=".18"/>
  <g transform="translate(840 54)" filter="url(#s)">
