    <circle cx="130" cy="104" r="67" fill="#31d5c5"/>
    <circle cx="105" cy="97" r="8" fill="#082134"/><circle cx="155" cy="97" r="8" fill="#082134"/>
    <path d="M103 129q27 22 54 0" fill="none" stroke="#082134" stroke-width="8" stroke-linecap="round"/>
    <rect x="48" y="193" width="164" height="18" rx="9" fill="#dcebe8"/><rect x="48" y="193" width="112" height="18" rx="9" fill="#f68a30"/>
